# Checks TapIt Studio on every push, and publishes the Docker image when main changes.
# Not run yet: it has been written but not tried on GitHub.
name: Studio

on:
  push:
    branches: [main]
    paths: ['studio/**', '.github/workflows/studio.yml']
  pull_request:
    paths: ['studio/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: studio
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tapit-studio:latest
            ghcr.io/${{ github.repository_owner }}/tapit-studio:${{ github.sha }}
