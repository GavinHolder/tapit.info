<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip replay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="./fonts/fonts.css" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:'Figtree',sans-serif}
.h{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-0.02em}
</style>
</helmet>

<div style="width:390px;height:1180px;box-sizing:border-box;background:{{pal.ink}};color:#fff;overflow:hidden;position:relative">
  <div style="position:absolute;left:0;right:0;top:0;height:760px">
    <dc-import name="Scene" pal="{{pal}}" view="{{view}}" vw="390" vh="760" hint-size="100%,760px"></dc-import>
  </div>

  <div style="position:absolute;left:16px;right:16px;top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px">
    <a href="Profile.dc.html" aria-label="Back to profile" style="width:44px;height:44px;border-radius:50%;background:{{pal.ink}};display:flex;align-items:center;justify-content:center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div role="group" aria-label="Map view" style="display:flex;background:{{pal.ink}};border-radius:999px;padding:4px">
      <button type="button" onClick="{{set2d}}" aria-pressed="{{is2d}}" style="{{btn2d}}">2D</button>
      <button type="button" onClick="{{set3d}}" aria-pressed="{{is3d}}" style="{{btn3d}}">3D</button>
    </div>
  </div>

  <div style="position:absolute;left:16px;top:84px;background:{{pal.ink}};border-radius:16px;padding:10px 14px">
    <div style="font-size:12px;color:{{pal.mist}};opacity:.8">Elevation</div>
    <div class="h" style="font-size:22px;font-weight:800">412 m</div>
  </div>

  <div style="position:absolute;left:0;right:0;top:728px;bottom:0;background:{{pal.ink}};border-radius:28px 28px 0 0;padding:22px 20px 0">
    <div style="width:44px;height:5px;border-radius:3px;background:{{pal.moss2}};margin:-8px auto 16px"></div>
    <div style="color:{{pal.accent}};font-size:13px;font-weight:600">Saturday 3 October. Kogelberg</div>
    <h1 class="h" style="margin:2px 0 14px;font-size:28px;line-height:1.05;font-weight:800">Palmiet River to the Hangklip ridge</h1>

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:6px">
      <button type="button" aria-label="Replay is looping" style="width:56px;height:56px;border-radius:50%;border:0;background:{{pal.accent}};color:{{pal.ink}};display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="{{pal.ink}}"/></svg>
      </button>
      <div style="flex:1;min-width:0">
        <svg role="img" aria-label="Replay progress" viewBox="0 0 220 18" style="width:100%;height:18px;display:block">
          <rect x="0" y="6" width="220" height="6" rx="3" fill="{{pal.moss2}}"/>
          <rect x="0" y="6" width="0" height="6" rx="3" fill="{{pal.accent}}"><animate attributeName="width" values="0;220;220" keyTimes="0;0.85;1" dur="14s" repeatCount="indefinite"/></rect>
          <circle cx="9" cy="9" r="8" fill="#ffffff"><animate attributeName="cx" values="9;211;211" keyTimes="0;0.85;1" dur="14s" repeatCount="indefinite"/></circle>
        </svg>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:{{pal.mist}};opacity:.8;margin-top:4px"><span>Start</span><span>Hangklip ridge</span></div>
      </div>
      <button type="button" style="min-height:44px;min-width:44px;border-radius:12px;border:1.5px solid {{pal.moss2}};background:transparent;color:#fff;font-weight:600;cursor:pointer">1x</button>
    </div>

    <svg role="img" aria-label="Elevation profile of the trip" viewBox="0 0 350 70" style="width:100%;height:70px;display:block;margin:10px 0 14px"><path d="M0 62 L40 52 L80 56 L130 30 L170 38 L210 14 L250 26 L290 10 L350 40 L350 70 L0 70Z" fill="{{pal.moss}}"/><path d="M0 62 L40 52 L80 56 L130 30 L170 38 L210 14 L250 26 L290 10 L350 40" fill="none" stroke="{{pal.accent}}" stroke-width="2.5"/></svg>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      <div style="background:{{pal.deep}};border-radius:16px;padding:12px"><div style="font-size:12px;color:{{pal.mist}};opacity:.8">Distance</div><div class="h" style="font-size:22px;font-weight:800">12.4 km</div></div>
      <div style="background:{{pal.deep}};border-radius:16px;padding:12px"><div style="font-size:12px;color:{{pal.mist}};opacity:.8">Climb</div><div class="h" style="font-size:22px;font-weight:800">684 m</div></div>
      <div style="background:{{pal.deep}};border-radius:16px;padding:12px"><div style="font-size:12px;color:{{pal.mist}};opacity:.8">Stamps</div><div class="h" style="font-size:22px;font-weight:800">2</div></div>
    </div>

    <div style="display:flex;gap:10px;margin-top:14px">
      <button type="button" style="flex:1;min-height:48px;border-radius:999px;border:0;background:{{pal.accent}};color:{{pal.ink}};font-weight:600;cursor:pointer">Share trip</button>
      <button type="button" style="flex:1;min-height:48px;border-radius:999px;border:1.5px solid {{pal.moss2}};background:transparent;color:#fff;font-weight:600;cursor:pointer">Download GPX</button>
    </div>
    <p style="margin:14px 0 0;font-size:12px;line-height:1.45;color:{{pal.mist}};opacity:.7">Your trail is private unless you share it. Delete it any time in Privacy settings. TapIt is not a safety device.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"base":{"editor":"enum","options":["fynbos","ocean","plum","forest","dusk","mono"],"default":"fynbos","section":"Style"},"accent":{"editor":"enum","options":["lime","coral","aqua","lilac","pink","sky"],"default":"lime","section":"Style"},"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: '3d' }; }
  pal() {
    const B = {
      fynbos: { ink: '#0B1F24', deep: '#12343B', moss: '#1E5A55', moss2: '#2F6A64', mist: '#EEF3F0' },
      ocean: { ink: '#07182B', deep: '#0E2A47', moss: '#1D4E7A', moss2: '#2F6FA3', mist: '#EAF2F8' },
      plum: { ink: '#1B1420', deep: '#2A1F33', moss: '#5B3A57', moss2: '#7A4E6E', mist: '#F4EEF2' },
      forest: { ink: '#141E12', deep: '#22351F', moss: '#3E5E34', moss2: '#5C7F4C', mist: '#F1F3E8' },
      dusk: { ink: '#0E0B24', deep: '#1A1544', moss: '#3A2F8F', moss2: '#5648C4', mist: '#EFEEF9' },
      mono: { ink: '#111111', deep: '#222222', moss: '#444444', moss2: '#666666', mist: '#F2F2F2' }
    };
    const A = { lime: '#C8F560', coral: '#FF8A5B', aqua: '#5EE6D8', lilac: '#B69CFF', pink: '#FF8FC7', sky: '#8FD3FF' };
    return Object.assign({}, B[this.props.base] || B.fynbos, { accent: A[this.props.accent] || A.lime, gold: '#F4B63F' });
  }
  seg(on, p) {
    const base = 'min-height:40px;min-width:56px;border:0;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;';
    return on ? base + 'background:' + p.accent + ';color:' + p.ink : base + 'background:transparent;color:#ffffff';
  }
  renderVals() {
    const m = this.state.mode;
    const p = this.pal();
    return {
      pal: p, view: m,
      is3d: m === '3d', is2d: m === '2d',
      btn3d: this.seg(m === '3d', p), btn2d: this.seg(m === '2d', p),
      set3d: () => this.setState({ mode: '3d' }),
      set2d: () => this.setState({ mode: '2d' })
    };
  }
}
</script>
</body>
</html>
